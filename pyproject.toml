# Fuente unica de dependencias (roadmap Clean Architecture, Fase 0.5).
# `requirements.txt` solo apunta aca, para que `pip install -r requirements.txt`
# siga funcionando como dicen el README y los mensajes de error.
# Tambien es el marcador con el que `agora/__init__.py` y
# `app_service/config/configuracion.py` encuentran la raiz del repositorio:
# no mover ni renombrar.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agora"
version = "0.1.0"
description = "PoC de comercio agentico sobre rieles colombianos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "cryptography>=42.0",
    "python-dotenv>=1.0",  # app-service: el .env
    "openai",
    "numpy",
    # Migracion a agentes, etapa 2 (docs/arquitectura-agentes/etapa-2-...):
    # solo `langchain-core` y los splitters, no el paquete `langchain` completo.
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    # Etapa 3: solo lo importa `agora/adaptadores/orquestacion/con_langgraph/`.
    # Con AGORA_ORQUESTACION=directo la app corre sin esta dependencia.
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# El paquete `agora` vive en el app-service; el resto de los modulos del
# scaffold se le enchufan al importarlo (ver su `__init__.py`).
[tool.setuptools.packages.find]
where = ["applications/app-service/src"]
include = ["agora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` encuentra `agora` sin instalar.
pythonpath = ["applications/app-service/src"]
